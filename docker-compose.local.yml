# VL Command no seu computador (sem domínio, sem HTTPS). No primeiro acesso você cria o seu usuário.
#   docker compose -f docker-compose.local.yml up --build
#   abra http://localhost:3000
# Para apagar tudo e recomeçar: docker compose -f docker-compose.local.yml down -v
x-app: &app
  build: .
  image: vl-command-local
  restart: on-failure   # volta sozinho após erro passageiro; o botão "Desligar" sai sem erro e não reinicia
  environment:
    DATABASE_URL: postgres://vlc:vlc@postgres:5432/vlc
    APP_KEY: chave-local-somente-para-demonstracao-123
    NODE_ENV: development   # cookie sem "Secure", pois localhost é http
    PERMITIR_DESLIGAR: "1"  # botão "Desligar sistema" no site
    PERMITIR_PRIMEIRO_ACESSO: "1"  # sem usuário cadastrado, a tela de login vira "criar acesso"
    # Opcionais, lidos do arquivo .env desta pasta. Sem eles, envios/bloqueios falham com aviso claro.
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    EMAIL_FROM: ${EMAIL_FROM:-}
    ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
    WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
    CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
  depends_on:
    postgres: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: vlc, POSTGRES_PASSWORD: vlc, POSTGRES_DB: vlc }
    volumes: [pgdata-local:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "vlc"], interval: 3s, retries: 20 }

  app:
    <<: *app
    ports: ["127.0.0.1:3000:3000"]
    command: ["sh", "-c", "node apps/api/src/migrate.ts && node apps/api/src/cli/limpar-demo.ts && node apps/api/src/server.ts"]

  worker:
    <<: *app
    command: ["sh", "-c", "sleep 15 && node apps/api/src/worker.ts"]  # espera a app criar o banco

  executor:   # único processo que executa ações aprovadas
    <<: *app
    command: ["sh", "-c", "sleep 15 && node apps/api/src/executor.ts"]

volumes: { pgdata-local: {} }
